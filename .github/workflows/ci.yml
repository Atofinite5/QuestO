name: Questo CI & Quality Gate

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON Files (n8n Workflows)
        run: |
          echo "Validating all n8n workflow JSON schemas..."
          for file in questo/n8n/*.json; do
            node -e "try { JSON.parse(require('fs').readFileSync('$file')); console.log('✓ Valid: $file'); } catch(e) { console.error('✗ Invalid JSON in $file:', e.message); process.exit(1); }"
          done

      - name: Validate Google Apps Script Syntax
        run: |
          echo "Validating GAS JavaScript syntax..."
          for file in questo/gas/*.js; do
            node -c "$file" && echo "✓ Syntax clean: $file"
          done

      - name: Check Against Hardcoded API Keys
        run: |
          echo "Auditing for leaked secrets or keys..."
          # Check for actual 39-character Google API keys (AIzaSy...)
          if grep -rn -E "AIzaSy[A-Za-z0-9_-]{30,}" questo/gas/; then
            echo "::error::Found hardcoded Google API Key!"
            exit 1
          fi
          # Check for actual live OpenRouter or OpenAI keys (sk-or-v1-... or sk-proj-...)
          if grep -rn -E "sk-(or-v1-)?[A-Za-z0-9_-]{30,}" questo/gas/; then
            echo "::error::Found hardcoded AI Secret Key!"
            exit 1
          fi
          echo "✓ No hardcoded secrets detected in source files."

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build & Validate React SWC Frontend
        run: |
          echo "Building production frontend assets..."
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          echo "✓ Frontend successfully built for production."
